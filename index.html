
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Femina Cam</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #17121c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #f3a8d4;
      margin-bottom: 6px;
    }

    .camera {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 16px auto;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    button {
      margin: 12px 4px;
      padding: 14px 20px;
      border: none;
      border-radius: 24px;
      background: #e78bc2;
      color: #241326;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      color: #f2dcec;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const startButton = document.getElementById("start");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("overlay");
    const status = document.getElementById("status");
    const ctx = canvas.getContext("2d", { alpha: true });

    let running = false;
    let landmarker = null;
    let lastVideoTime = -1;
    let lastStatus = "";

    function setStatus(message) {
      if (message !== lastStatus) {
        status.textContent = message;
        lastStatus = message;
      }
    }

    async function startCamera() {
      if (running) return;

      startButton.disabled = true;
      setStatus("Chargement du détecteur facial…");

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Caméra non disponible dans ce navigateur.");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 480 },
            height: { ideal: 360 },
            frameRate: { ideal: 30, max: 30 }
          }
        });

        video.srcObject = stream;
        await video.play();

        setStatus("Chargement du suivi facial…");

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        landmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          minFaceDetectionConfidence: 0.5,
          minFacePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
          outputFaceBlendshapes: true
        });

        canvas.width = 480;
        canvas.height = 360;
        running = true;
        setStatus("Caméra active : recherche du visage…");

        requestAnimationFrame(trackFace);
      } catch (error) {
        setStatus("Erreur : " + error.message);
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
        }
        startButton.disabled = false;
      }
    }

    function trackFace() {
      if (!running) return;

      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        try {
          const results = landmarker.detectForVideo(
            video,
            performance.now()
          );

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (results.faceLandmarks.length > 0) {
            const points = results.faceLandmarks[0];

            ctx.fillStyle = "#ff8bd1";

            for (const point of points) {
              ctx.beginPath();
              ctx.arc(
                point.x * canvas.width,
                point.y * canvas.height,
                1.2,
                0,
                Math.PI * 2
              );
              ctx.fill();
            }

            setStatus(
              "Visage détecté : " + points.length +
              " points suivis."
            );
          } else {
            setStatus("Place ton visage devant la caméra.");
          }
        } catch (error) {
          setStatus("Erreur de suivi : " + error.message);
        }
      }

      requestAnimationFrame(trackFace);
    }

    startButton.addEventListener("click", startCamera);
  </script>
</head>

<body>
  <h1>Femina Cam</h1>
  <p>Suivi facial en direct</p>

  <div class="camera">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="start">Activer caméra et suivi</button>
  <p id="status">Appuie pour démarrer.</p>
</body>
</html>
