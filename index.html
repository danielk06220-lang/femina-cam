
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Femina Cam</title>
  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #17121c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #f3a8d4; }
    .camera {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: auto;
    }
    video, canvas {
      width: 100%;
      border-radius: 16px;
    }
    video { display: block; transform: scaleX(-1); }
    canvas {
      position: absolute;
      inset: 0;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }
    button {
      margin: 14px;
      padding: 14px 20px;
      border: 0;
      border-radius: 24px;
      background: #e78bc2;
      font-weight: bold;
      font-size: 16px;
    }
    #status { overflow-wrap: anywhere; }
  </style>
  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    window.startFaceTracking = async function () {
      const video = document.getElementById("camera");
      const canvas = document.getElementById("overlay");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");
      const button = document.getElementById("start");

      button.disabled = true;
      status.textContent = "Chargement du détecteur facial…";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const landmarker = await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            },
            runningMode: "VIDEO",
            numFaces: 1,
            outputFaceBlendshapes: true
          }
        );

        canvas.width = 640;
        canvas.height = 480;
        status.textContent = "Caméra active : recherche du visage…";

        let lastTime = -1;
        function track() {
          if (video.readyState >= 2 && video.currentTime !== lastTime) {
            lastTime = video.currentTime;
            const results = landmarker.detectForVideo(
              video, performance.now()
            );
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.faceLandmarks.length > 0) {
              const points = results.faceLandmarks[0];
              ctx.fillStyle = "#ff8bd1";
              for (const p of points) {
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, 1.3, 0, Math.PI * 2);
                ctx.fill();
              }
              status.textContent =
                "Visage détecté : " + points.length +
                " points suivis en direct.";
            } else {
              status.textContent = "Place ton visage devant la caméra.";
            }
          }
          requestAnimationFrame(track);
        }
        track();
      } catch (e) {
        status.textContent = "Erreur : " + e.message;
        button.disabled = false;
      }
    };
  </script>
</head>
<body>
  <h1>Femina Cam</h1>
  <p>Suivi facial en direct</p>
  <div class="camera">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <button id="start" onclick="startFaceTracking()">
    Activer caméra et suivi
  </button>
  <p id="status">Appuie pour démarrer.</p>
</body>
</html>
